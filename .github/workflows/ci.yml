name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      vactor_ref:
        description: 'vactor 的 revision（分支 / 标签 / 完整 SHA）；留空则用仓库内 .vactor-revision'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: checkout dvactor
        uses: actions/checkout@v4

      - name: resolve vactor revision
        # 优先级：手动输入的 vactor_ref > 仓库内 .vactor-revision。
        # 固定 revision 是为了让 CI 结果可复现：原先从默认分支拉取时，
        # vactor 一有新提交，dvactor 的 CI 结果就可能变。
        id: vactor_rev
        run: |
          rev="${{ github.event.inputs.vactor_ref }}"
          if [ -z "$rev" ]; then
            rev=$(grep -v '^[[:space:]]*#' .vactor-revision | grep -v '^[[:space:]]*$' | head -1 | tr -d ' \r')
          fi
          if [ -z "$rev" ]; then
            echo "::error::无法确定 vactor revision：请检查 .vactor-revision 或手动指定 vactor_ref"
            exit 1
          fi
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
          echo "vactor revision: $rev"

      - name: checkout vactor (pinned)
        uses: actions/checkout@v4
        with:
          repository: kofplayer/vactor
          path: vactor
          ref: ${{ steps.vactor_rev.outputs.rev }}
          # 按完整 SHA 检出时需要能取到该 commit
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: point replace at checked-out vactor
        run: go mod edit -replace github.com/kofplayer/vactor=./vactor

      - name: show vactor revision
        # 便于排查"vactor 版本变了导致 dvactor CI 结果变化"
        run: |
          echo "requested: ${{ steps.vactor_rev.outputs.rev }}"
          git -C vactor log --oneline -1

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: gofmt
        # 只检查本仓库代码：./vactor 是外部检出的独立模块，不参与本仓库格式校验
        run: |
          out=$(gofmt -l . | grep -v '^vactor/' || true)
          if [ -n "$out" ]; then
            echo "::error::these files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: lint
        # 版本固定为 v2.13.2：本地已用它跑通（0 issues）。若写 latest，
        # CI 侧升级后新增的默认规则会变成"本地绿、CI 红"且难以本地复现。
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: test (race + coverage)
        # 覆盖率只统计手写库代码：examples/testutil 为 0%，protocol 是生成代码，均不参与
        run: |
          pkgs=$(go list ./... | grep -v -E '/(examples|testutil)(/|$)' | grep -v '/protocol$')
          go test -race -timeout 18m -coverprofile=coverage.out $pkgs

      - name: coverage gate (>= 85%)
        run: |
          go tool cover -func=coverage.out | tail -1
          pct=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          if awk -v c="$pct" 'BEGIN{exit !(c < 85)}'; then
            echo "::error::statement coverage ${pct}% is below the 85% gate"
            exit 1
          fi
          echo "coverage ${pct}% >= 85%"

      - name: bench (smoke)
        # 冒烟：确保 marshal_bench_test.go 的编解码基准能编译、能跑通。
        # CI 机器性能波动大，不设性能阈值；-benchtime 1x 只跑一轮迭代。
        run: go test -run '^$' -bench . -benchtime 1x -timeout 5m ./
